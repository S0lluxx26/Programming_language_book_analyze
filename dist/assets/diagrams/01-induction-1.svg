/g><g class="node default" id="flowchart-N1-1" transform="translate(148.31787109375, 197.59999084472656)"><rect class="basic label-container" style="" x="-140.31787109375" y="-48.19999885559082" width="280.6357421875" height="96.39999771118164"/><g class="label" style="" transform="translate(0, -28.19999885559082)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style=""><tspan class="text-outer-tspan" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">List</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> its</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> premises</tspan></tspan><tspan class="text-outer-tspan" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">What</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> smaller</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> objects</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> must</tspan></tspan><tspan class="text-outer-tspan" x="0" y="2.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">already</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="normal"> exist?</tspan></tspan></text></g></g></g><g class="node default" id="flowchart-N2-4" transform="translate(148.31787109375, 348.34999084472656)"><rect class="basic label-container" style="" x="-134.770751953125" y="-57.55000305175781" width="269.54150390625" height="115.10000610351562"/><g class="label" style="" transform="translate(0, -37.55000305175781)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style=""><tspan class="text-outer-tspan" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">Establish</tspan><tspan font-style="normal" class="text-inner-tsp