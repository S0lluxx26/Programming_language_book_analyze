name: Verify and publish book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14.1'
      - name: Run original teaching examples
        run: opam exec -- ocaml examples/notebook_examples.ml
      - name: Run complete annotated chapter examples
        run: opam exec -- ocaml examples/reading_aids.ml
      - name: Run supporting reading examples
        run: opam exec -- ocaml examples/supporting_examples.ml
      - name: Run all textbook worked solutions
        run: |
          for solution in examples/textbook_*.ml; do
            opam exec -- ocaml "$solution"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
